# nginx log filter for openGym — docker json-file driver wraps every line
# in a JSON envelope: {"log":"<real nginx line>\n","stream":"stdout","attrs":{...},"time":"..."}.
# We match the IP at the start of the inner "log" field and a 4xx/5xx status
# after the closing quote of the request line.
#
# Real record example (one line):
# {"log":"192.168.0.17 - - [28/Aug/2026:15:25:04 +0000] \"HEAD /.env HTTP/1.1\" 404 0 \"-\" \"curl/8.18.0\" \"190.46.115.31\"\n","stream":"stdout","attrs":{"tag":"opengym-web"},"time":"2026-08-28T15:25:04Z"}

[INCLUDES]
# Pull in before/after helpers when present. Standard fail2ban layout.
before = nginx-http-before.conf
after  = nginx-http-after.conf

[Definition]
# Match: {"log":"<ip> - <user> [date] "METHOD path HTTP/X" status size ...
# The IP is the first host after {"log":"; status is a 4xx or 5xx after
# the closing quote of the request line. The inner \" escapes in the
# request line are preserved by the docker json-file driver verbatim.
failregex = ^\{"log":"<HOST> - [^"]*"\S+ \S+ [^"]+" (4\d\d|5\d\d)\s

# Anything that isn't a 4xx/5xx is a successful request and doesn't
# count as a fail. 3xx (redirects), 2xx (success), 1xx (informational)
# are normal browser behaviour and shouldn't trigger a ban.

ignoreregex =