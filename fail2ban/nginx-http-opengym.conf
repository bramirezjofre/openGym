# nginx log filter for openGym — plain combined log format from the
# bind-mounted /var/log/opengym/access.log. nginx writes lines like:
#
#   192.168.0.17 - - [28/Aug/2026:15:25:04 +0000] "HEAD /.env HTTP/1.1" 404 0 "-" "curl/8.18.0" "190.46.115.31"
#
# The filter and the jail both match this shape (no JSON envelope — nginx
# writes the access log directly because the file lives on a bind mount).
#
# The <HOST> macro is what fail2ban substitutes into the action.

[INCLUDES]
# Pull in before/after helpers when present. Standard fail2ban layout.
before = nginx-http-before.conf
after  = nginx-http-after.conf

[Definition]
# Match: <ip> - <user> [date] "METHOD path HTTP/X" status size
# A fail is any 4xx or 5xx status on a non-cross-origin request. 3xx
# (redirects) and 2xx (success) don't count.
failregex = ^<HOST> - [^"]*"\S+ \S+ [^"]+" (4\d\d|5\d\d)\s

ignoreregex =