/* nginx log filter for openGym — matches both the docker container's stdout
 * logs and a real /var/log/nginx/access.log line. We pick out the remote IP,
 * the status, the request, and the User-Agent so the jail action can
 * distinguish a slow scanner from a single bad attempt.

   Examples that should match:
     192.168.0.17 - - [28/Aug/2026:14:18:17 +0000] "GET /.env.js HTTP/1.1" 404 153
     91.92.40.149  - - "GET /test.php HTTP/1.1" 200 665
     10.0.0.5      - - "POST /api/register/options HTTP/1.1" 400 32

   The <HOST> macro is what fail2ban substitutes into the action.
   We need the IP at the start and a 4xx/5xx status somewhere on the line
   for the failureregex to fire. */

[INCLUDES]
# Pull in before/after helpers when present. Standard fail2ban layout.
before = nginx-http-before.conf
after  = nginx-http-after.conf

[Definition]
# Match: <ip> - <user> [date] "METHOD path HTTP/X" status size
# The status group is the trigger — anything 4xx or 5xx counts as a fail.
# Date, size, and referrer/ua are optional and tolerated.
failregex = ^\s*<HOST> - [^"]*"\S+ \S+ [^"]+" (4\d\d|5\d\d)\s

# A "fail" must be one of those statuses. 3xx (redirects), 2xx (success), and
# 1xx (informational) don't count — those are normal browser behaviour and
# shouldn't trigger a ban.

# Tolerate a couple of these per window before banning.
ignoreregex =