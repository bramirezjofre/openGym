# openGym — standalone web server: serves the static app AND proxies /api to the backend,
# so the whole app lives on ONE origin (required for WebAuthn / passkeys).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers. The project assumes a TLS-terminating reverse proxy in front
    # (Caddy / Traefik / Nginx Proxy Manager) and leaves HSTS to it; everything else
    # belongs here so a self-hoster who skips the proxy still has a defensible baseline.
    # CSP is intentionally narrow: the app is fully self-hosted from this origin, with
    # '/api' proxied to the backend and 'self' for everything else. 'unsafe-inline'
    # stays for styles only — Vite emits a single inlined <style> on first paint and
    # the app does not run any inline scripts. Worker-src is needed by the service
    # worker that caches media; connect-src widens the /api path to the proxied backend.
    include /etc/nginx/conf.d/security-headers.conf;

    # API → backend container
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/conf.d/security-headers.conf;
    }

    # SPA fallback. A real asset path that doesn't exist (typo, removed
    # chunk) is a 404 — the user sees a real "missing" page, and a scanner
    # probing for /.env / .php / wp-admin gets a 404 instead of a 200 with
    # the SPA shell, which used to confirm "yes, there's a web app here".
    # Hash routes (/#/workout) are SPA-only and never hit nginx (the
    # browser strips the fragment before sending), so they don't need
    # any special handling here.
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/conf.d/security-headers.conf;
    }

    # Explicit 404 for paths that look like probes. Returning a hard 404
    # (not the SPA) keeps the scanners from confirming a live SPA target.
    # The /api/ proxy still answers with its own status codes upstream;
    # this only catches /portal/phpinfo.php /wp-admin /.env etc that the
    # SPA fallback would otherwise answer as 200.
    location ~* /\.(env|git|htaccess|htpasswd|user.ini) {
        return 404;
    }
    location ~* \.(php|asp|aspx|jsp|cgi)$ {
        return 404;
    }

    # App shell: always revalidate so updates show up immediately.
    # Security headers come from the snippet — without the include, nginx's location-level
    # add_header would REPLACE the parent block's headers (it does not merge them).
    location ~* \.(js|css|json|html)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        include /etc/nginx/conf.d/security-headers.conf;
    }

    # Exercise images/GIFs never change → cache hard. Same nginx gotcha as above.
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        include /etc/nginx/conf.d/security-headers.conf;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_vary on;
    gzip_min_length 1024;
}