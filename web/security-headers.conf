# Security headers snippet — included from each nginx location that needs them.
#
# Why this is needed: nginx has a sharp edge where an `add_header` inside a `location` block
# REPLACES the parent block's add_header directives (it does not merge them). Every
# location that defines its own add_header (the cache-control blocks in web/nginx.conf)
# has to include this file, or the headers disappear on those responses.
#
# Keep this list in sync with the parent-block add_header directives in web/nginx.conf.
# When you add a header in one place, add it here too — the nginx config parser will not
# warn you about the mismatch.

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src 'self' ws: wss:; worker-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;